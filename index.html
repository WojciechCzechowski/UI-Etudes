<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Études</title>
    <meta
      name="description"
      content="Small, finished interaction studies in React: meaningful transitions, responsive layouts and accessibility."
    />
    <script>
      try {
        var theme = localStorage.getItem('ui-etudes-theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
