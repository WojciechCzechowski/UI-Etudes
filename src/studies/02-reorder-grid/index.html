<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag to reorder a thumbnail grid · UI Études</title>
    <script>
      try {
        var theme = localStorage.getItem('ui-etudes-theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studies/02-reorder-grid/main.tsx"></script>
  </body>
</html>
